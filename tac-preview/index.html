    <!-- Google Tag Manager + GA4 — DEFERRED.
         Loading gtm.js / gtag.js in the head competed with the app JS for
         bandwidth + main-thread time during hydration, hurting mobile
         FCP/LCP/TBT on Slow 4G. They carry no above-the-fold render value, so
         we load them on the first user interaction OR when the main thread
         first goes idle (requestIdleCallback, ~3.5s cap) — whichever comes
         first. Analytics still fire within the session; the critical render
         path is freed. dataLayer is created immediately so any early pushes
         are preserved and replayed once GTM/GA attach. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      (function () {
        var loaded = false;
        function loadTags() {
          if (loaded) return; loaded = true;
          // GTM
          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != 'dataLayer' ? '&l=' + l : '';
            j.async = true;
            j.src = 'https://www.googletagmanager.com/gtm.js?id=' + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, 'script', 'dataLayer', 'GTM-KFF28PCG');
          // GA4 gtag.js
          var g = document.createElement('script');
          g.async = true;
          g.src = 'https://www.googletagmanager.com/gtag/js?id=G-FB560VK6LD';
          document.head.appendChild(g);
          gtag('js', new Date());
          gtag('config', 'G-FB560VK6LD');
        }
        var evs = ['scroll', 'mousemove', 'touchstart', 'pointerdown', 'keydown', 'click'];
        function onFirst() {
          evs.forEach(function (e) { window.removeEventListener(e, onFirst); });
          loadTags();
        }
        evs.forEach(function (e) {
          window.addEventListener(e, onFirst, { passive: true, once: true });
        });
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadTags, { timeout: 3500 });
        } else {
          window.addEventListener('load', function () { setTimeout(loadTags, 2500); });
        }
      })();
    </script>
    <!-- End Google Tag Manager + GA4 (deferred) -->

    <!-- Fonts — preconnect for the CDN handshake, then non-blocking
         stylesheet load. The `media="print"` + onload trick tells the
         browser this CSS is for print only (which doesn't block render),
         then on load swaps it to all media. Combined with display=swap
         on each face, text paints immediately in the system fallback
         and re-renders smoothly when the web fonts arrive. Only the
         weights actually used in the codebase (300, 400, 500, 600, 700)
         are loaded; 800 was dropped (no `font-extrabold` in src/). -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,600,700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,600,700&display=swap"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap"
      />
    </noscript>
