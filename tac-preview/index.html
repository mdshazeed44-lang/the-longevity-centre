    <meta property="og:locale" content="en_IN" />

      name="twitter:description"
      content="India's first doctor-led personalised longevity programme. Diagnostics-led, physician-guided care across longevity, metabolic and biological-age reversal."
    />

    <!-- Fonts (preconnect + preload) -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights we actually use — keeps font payload small.
         display=swap so text shows immediately in the fallback while web font loads. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@300,400,500,600,700,800&display=swap"
      rel="stylesheet"
    />
    <!-- Alex Brush only used in a couple of decorative spots — load deferred -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" />
    </noscript>

    <!-- Preload key brand assets so first paint isn't blocked on logo -->
    <link rel="preload" as="image" href="/tlc-logo.png" />

    <!-- DNS-prefetch for analytics / Google fonts CDN that lazy-loads later -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://cdn.fontshare.com" />
